<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CUBEWORKS: 4×4 AR Solver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* Every screen sets its own font inline, so nothing renders in the fallback
       today, but with no family on body the inherited value is the UA default
       serif, and any element that later forgets to set one lands in Times. Name
       the display face once, here, so the fallback is the intended one. */
    html, body {
      margin: 0; padding: 0; background: #08090B;
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    a { color: #4FE3C1; text-decoration: none; }
    a:hover { color: #7CF0D8; }
    @keyframes cw-pulse { 0%, 100% { opacity: .4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.07); } }
    @keyframes cw-nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(9px); } }
    @keyframes cw-blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes cw-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes cw-ring { 0%, 100% { box-shadow: 0 0 0 2px rgba(232,64,42,.9); } 50% { box-shadow: 0 0 0 4px rgba(232,64,42,.35); } }
    @keyframes cw-spin { to { transform: rotate(360deg); } }

    /* Visually hidden, still announced. Each screen carries an h1 naming the
       step, because the visible design has no single title element, the largest
       text on Solve is the move token, which is the wrong thing to open with. */
    .cw-sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* The controls are divs with role="button" and tabindex, so keyboard focus
       falls back to the browser's default ring, an orange that belongs to no
       part of this palette. Use the accent instead, and only for :focus-visible
       so a mouse click does not leave a ring behind. */
    [role="button"]:focus-visible, a:focus-visible, button:focus-visible {
      outline: 2px solid #4FE3C1;
      outline-offset: 2px;
      border-radius: 8px;
    }

    /* ---------------------------------------------------------------- mobile
       This is a camera app: the phone is the device it is for, and until now the
       desktop shell rendered unchanged at 375px. The layout did not scroll, it
       clipped, the cube, the play control and half the header sat outside the
       viewport and were unreachable.

       The screens compose their layout from two shared objects in ui/theme.js,
       `stage` (a flex row) and `sidePanel` (a fixed 330px column). Those are
       inline styles, which a media query cannot reach, so each site carries a
       class and the rules below override with !important. That is the whole
       mechanism: turn the row into a column, let the panel go full width, and
       give each half its own scroll region. */
    @media (max-width: 768px) {
      .cw-stage {
        flex-direction: column !important;
        overflow: hidden;
      }
      /* Split the stage by ratio rather than by vh. Fixed viewport units have to
         be budgeted against the header and against each other, and the first
         attempt here summed past 100%, which pushed the panel's primary action
         below the fold, where it was as unreachable as the bug this replaced.
         Two flex children of a column that is already exactly the height left
         over cannot overflow it. */
      .cw-stage > :not(.cw-panel) {
        flex: 1 1 40% !important;
        min-height: 0 !important;
        min-width: 0;
      }
      /* `flex: none` and a 330px width are inline, so both need overriding.
         min-height:0 lets a flex child shrink below its content, and overflow-y
         is what turns that shrink into a scroll rather than a clip, without it
         the panel simply hides whatever does not fit, primary actions included. */
      .cw-panel {
        width: 100% !important;
        flex: 1 1 60% !important;
        min-height: 0 !important;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        border-left: none !important;
        border-top: 1px solid rgba(255,255,255,0.07) !important;
        padding-bottom: env(safe-area-inset-bottom);
      }
      /* The Solve stage. Its transport controls sat at `position: absolute;
         bottom: 18`, which works when the stage is wide and short, the cube,
         the move card and the chip strip take about 450px of flow, and on a
         desktop stage there is room beneath them. In a stage 300px tall the
         absolute layer simply lands on top of the flow: measured at 24
         overlapping element pairs, worst 188x28, with "Play along" covering the
         move description. So on a phone the transport rejoins the flow and
         `margin-top: auto` pushes it to the bottom of the column instead. */
      .cw-solve-stage {
        justify-content: flex-start !important;
        padding: 4px 0 8px;
      }
      /* The grip reminder floats over the top-left of a roomy desktop stage. At
         phone width it sits squarely on the cube's top rows, hiding the state
         the user is checking against their hands. In flow instead, above the
         cube, where it reads as the caption it actually is. */
      .cw-solve-tophint {
        position: static !important;
        flex: none;
        align-self: stretch;
        justify-content: space-between;
        padding: 0 12px 6px;
      }
      /* Cube3D renders at a fixed pixel size, so the wrapper is scaled rather
         than threading a breakpoint through the component. The wrapper takes
         whatever height is left after the card and the transport have theirs, a fixed height cannot work here, because the space available depends on
         the viewport and on whether the session-restore banner is showing. The
         card and the transport are the two things that must never be clipped;
         the cube can lose its bottom rows and still tell you the grip. */
      .cw-solve-cube {
        flex: 1 1 auto;
        min-height: 0;
        align-self: stretch;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow: hidden;
      }
      .cw-solve-cube > * {
        transform: scale(0.46);
        transform-origin: center top;
        flex: none;
      }
      .cw-solve-card {
        margin-top: 2px !important;
        padding: 9px 15px !important;
        gap: 12px !important;
        flex: none;
        max-width: calc(100% - 24px);
      }
      /* The look-ahead strip duplicates the panel's move list, which is on the
         same screen now that the layout is stacked. Dropping it buys the ~60px
         the transport needs. */
      .cw-solve-chips { display: none !important; }
      .cw-solve-transport {
        position: static !important;
        transform: none !important;
        margin-top: auto !important;
        flex: none;
      }

      /* Brand and chrome that cost more width than they earn on a phone. The
         logo mark, the step tabs and Reset survive; the wordmark, the 4x4x4
         badge, the step numbers, the tab separators and the "Color labels"
         caption do not. */
      .cw-hide-sm { display: none !important; }
      .cw-header {
        gap: 10px !important;
        padding: 0 10px !important;
      }
    }
    /* "SPACE PLAY · ← → STEP" is advice a touch user cannot act on. Gate it on
       the input device rather than the width, because a narrow desktop window
       still has a keyboard and a tablet with one attached reports fine pointer. */
    @media (pointer: coarse) {
      .cw-kbd-hint { display: none !important; }
      /* The step arrows are 40x40, under the 44px minimum, and they are the two
         controls a user presses on every single move of a 168-move solve. */
      .cw-transport-btn { width: 44px !important; height: 44px !important; }
    }

    /* Phone browsers report 100vh as the height with the URL bar hidden, which
       leaves the bottom of a 100vh layout under the chrome. dvh tracks the
       visible height where it is supported. */
    @supports (height: 100dvh) {
      .cw-app { height: 100dvh !important; }
    }

    /* Six looping animations run in this app, the scan pulse, the turn nudge,
       the blink, the parity ring and the solver spinner. Vestibular disorders
       make sustained motion genuinely unpleasant, and none of these carries
       information that the static state does not. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
